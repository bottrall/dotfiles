"$schema" = 'https://starship.rs/config-schema.json'

# hotglass state-driven prompt (see ~/.config/hotglass/DESIGN.md): segments
# keep the powerline shape but sit on neutral raise tiers, fading rightward;
# the directory is the one accent surface. Color otherwise appears only for
# state — git_status renders yellow only when the tree is dirty, and the
# prompt character flips red after a failed command.
format = """
[](raise1)\
$os\
$username\
[](bg:accent fg:raise1)\
$directory\
[](fg:accent bg:raise2)\
$git_branch\
$git_status\
[](fg:raise2 bg:raise3)\
$nodejs\
$ruby\
$docker_context\
[](fg:raise3)\
$time\
$line_break$character"""

palette = 'hotglass'

# hotglass:begin
# GENERATED by hotglass/generate — edit tokens.toml and rerun; do not edit this file.
[palettes.hotglass]
accent = "#FF52AB"
red = "#FF5C6C"
yellow = "#FFC44D"
green = "#3DE383"
blue = "#4FA8FF"
text = "#FFFFFF"
dim = "#A6A6A6"
muted = "#666666"
ink = "#000000"
raise1 = "#242424"
raise2 = "#171717"
raise3 = "#0D0D0D"
# hotglass:end

[os]
disabled = false
style = "bg:raise1 fg:dim"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:raise1 fg:dim"
style_root = "bg:raise1 fg:red"
format = '[ $user ]($style)'

[directory]
style = "fg:ink bg:accent bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:raise2 fg:dim"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:raise2 fg:yellow"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "bg:raise3 fg:muted"
format = '[ $symbol( $version) ]($style)'

[ruby]
symbol = ""
style = "bg:raise3 fg:muted"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "bg:raise3 fg:muted"
format = '[ $symbol( $context) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:muted"
format = '[  $time ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:accent)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:accent)'
vimcmd_replace_one_symbol = '[](bold fg:yellow)'
vimcmd_replace_symbol = '[](bold fg:yellow)'
vimcmd_visual_symbol = '[](bold fg:blue)'
