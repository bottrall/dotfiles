general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Resume resets the case RGB's USB controller: the board falls back to its
    # own rainbow, and the OpenRGB server silently stops driving it until
    # restarted. The screen comes back on, so the case RGB does too.
    # No dpms(true) here: Hyprland lights the screen itself on resume, and
    # forcing it the instant we wake (mid DP link retrain) drops the Dell back
    # into deep sleep — no signal until it's power-cycled.
    after_sleep_cmd = systemctl --user restart openrgb.service && ~/.config/hypr/scripts/case-rgb.sh on
}

listener {
    timeout = 150 # 2.5min
    on-timeout = ddcutil setvcp 10 10
    on-resume = ddcutil setvcp 10 100
}

listener {
    timeout = 300 # 5min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 450 # 7.5min
    on-timeout = hyprctl eval "hl.dispatch(hl.dsp.dpms(false))" # screen off when timeout has passed
    on-resume = hyprctl eval "hl.dispatch(hl.dsp.dpms(true))" && ddcutil setvcp 10 100 # screen on when activity is detected after timeout has fired.
}

# Case RGB follows the screen, in its own listener so waking it doesn't wait on
# ddcutil (slow while the monitor comes out of standby).
listener {
    timeout = 450 # 7.5min
    on-timeout = ~/.config/hypr/scripts/case-rgb.sh off
    on-resume = ~/.config/hypr/scripts/case-rgb.sh on # fades back up
}

listener {
    timeout = 28800 # 8h
    on-timeout = systemctl suspend # suspend pc
}