# Satty — screenshot annotation. Fed by hyprshot from the SUPER+Home binds in
# hypr/binds.lua. Options live here rather than as CLI flags in the bind:
# upstream plans to fold most flags into a generic --config (Satty #782).
# Reference: https://github.com/Satty-org/Satty#configuration-file

[general]
# Ctrl+S target (strftime; leading ~ is expanded)
output-filename = "~/Pictures/Screenshots/screenshot-%Y%m%d-%H%M%S.png"
# Hand the image to wl-copy. Without it Satty owns the clipboard itself and
# the image is gone the moment the window closes.
copy-command = "wl-copy"
# Enter copies and closes (the common path). Ctrl+C / Ctrl+S copy or save
# and stay open, like swappy did. Esc exits (Satty's default).
actions-on-enter = ["save-to-clipboard", "exit"]
initial-tool = "arrow"
# hotglass: radius 0, always
corner-roundness = 0
no-window-decoration = true

[font]
# hotglass GTK app font
family = "Adwaita Sans"
style = "Regular"

# hotglass:begin
# GENERATED by hotglass/generate — edit tokens.yml and rerun; do not edit this file.
[color-palette]
palette = ["#FF52ABFF", "#FF5C6CFF", "#FFC44DFF", "#3DE383FF", "#4FA8FFFF", "#FFFFFFFF", "#000000FF"]
# hotglass:end
