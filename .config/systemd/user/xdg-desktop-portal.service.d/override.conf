# xdg-desktop-portal (1.22) only reads *.portal definitions from
# /usr/share/xdg-desktop-portal/portals, or from XDG_DESKTOP_PORTAL_DIR
# *instead*. That dir holds symlinks to the system definitions (kept in sync
# by install.sh) plus nautilus.portal, which routes FileChooser to Nautilus.
[Service]
Environment=XDG_DESKTOP_PORTAL_DIR=%h/.config/xdg-desktop-portal/portals
