# The machine voice: one monospace face for terminal, prompt and code.
font-family = CaskaydiaCove Nerd Font
font-size = 13

# Level 1 window glass; Hyprland blurs behind it.
background = #000000
background-opacity = 0.78
window-padding-x = 16
window-padding-y = 12
window-padding-balance = true

# The caret is the purest "you are here" mark; selection matches the
# prompt's directory block.
cursor-color = #FF52AB
cursor-text = #000000
selection-background = #C40869
selection-foreground = #FFFFFF

# ANSI status subset: errors, warnings and success look the same here as
# everywhere else. Black, white and cyan stay stock.
palette = 1=#FF6A4D
palette = 9=#FF6A4D
palette = 2=#3DE383
palette = 10=#3DE383
palette = 3=#FFC44D
palette = 11=#FFC44D
palette = 4=#4FA8FF
palette = 12=#4FA8FF
palette = 5=#FF52AB
palette = 13=#FF52AB
