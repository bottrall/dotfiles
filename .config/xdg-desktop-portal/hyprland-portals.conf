# Overrides /usr/share/xdg-desktop-portal/hyprland-portals.conf (same
# defaults, plus a FileChooser route). See ../hotglass/DESIGN.md.
#
# Electron/Chromium apps (VS Code) open file pickers through the portal, so
# this decides what the "Open Folder" dialog is. "gnome" is
# xdg-desktop-portal-gnome, which delegates FileChooser to Nautilus — the
# actual hotglass Nautilus, glass and all. It only activates Nautilus on the
# first picker request, never during portal startup (routing the portal at
# Nautilus directly deadlocked boot for 25s). It needs the uwsm session:
# graphical-session.target (unit Requisite) and XDG_SESSION_TYPE=wayland, or it
# degrades to settings-only and this falls back to xdg-desktop-portal-gtk's
# GTK3 dialog (themed by ../gtk-3.0/gtk.css).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gnome;gtk
