# Overrides /usr/share/xdg-desktop-portal/hyprland-portals.conf (same
# defaults, plus a FileChooser route). See ../hotglass/DESIGN.md.
#
# Electron/Chromium apps (VS Code) open file pickers through the portal, so
# this decides what the "Open Folder" dialog is. "nautilus" is our own
# portals/nautilus.portal: Nautilus itself — the actual hotglass Nautilus,
# glass and all. Falls back to xdg-desktop-portal-gtk's GTK3 dialog (themed
# by ../gtk-3.0/gtk.css).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=nautilus;gtk
